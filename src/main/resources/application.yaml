server:
  port: ${SERVER_PORT:5007}
  servlet:
    context-path: ${CONTEXT_PATH:/relationship}

spring:
  application:
    name: ${APP_NAME:relationship-service}

  main:
    allow-bean-definition-overriding: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/clone_fb_relationship}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false

  data:
    jpa:
      repositories:
        enabled: true

app:
  services:
    file: ${FILE_SERVICE_URL:http://localhost:5005}
    gateway: ${GATEWAY_URL:http://localhost:5000}  # Gateway URL để emit Socket.IO events

socketio:
  host: ${SOCKETIO_HOST:0.0.0.0}  # Bind to all interfaces (0.0.0.0 = all network interfaces)
  port: ${SOCKETIO_PORT:9093}  # Socket.IO port riêng (không thể chạy cùng port với HTTP server)
  # Lưu ý: netty-socketio là standalone server, không thể bind cùng port với Spring Boot Tomcat
  # Gateway dùng port 9092, relationship-service dùng port 9093 để tránh conflict

logging:
  level:
    root: ${LOGGING_LEVEL:INFO}
    "[com.tam.relationship]": DEBUG
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.type.descriptor.sql.BasicBinder]": TRACE
